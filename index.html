<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJ Carlos Jerez — Official Website</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{

  --black:#050507;
  --deep:#0d0d12;
  --surface:#16161d;
  --border:#262631;

  --accent:#ff1e1e;
  --accent2:#ffffff;

  --text:#ffffff;
  --muted:#8d8d99;

}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  background:var(--black);
  color:var(--text);

  font-family:'Rajdhani',sans-serif;

  overflow-x:hidden;

}

/* =========================================
   BACKGROUND FX
========================================= */

body::before{

  content:'';

  position:fixed;
  inset:0;

  background:
  radial-gradient(circle at 20% 20%, rgba(255,30,30,.08), transparent 30%),
  radial-gradient(circle at 80% 50%, rgba(255,255,255,.03), transparent 35%),
  radial-gradient(circle at 50% 100%, rgba(255,30,30,.06), transparent 40%);

  z-index:-2;

}

body::after{

  content:'';

  position:fixed;
  inset:0;

  background-image:
  linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

  background-size:60px 60px;

  z-index:-1;

}

/* =========================================
   CURSOR
========================================= */

.cursor{

  width:12px;
  height:12px;

  background:var(--accent);

  border-radius:50%;

  position:fixed;
  top:0;
  left:0;

  pointer-events:none;

  z-index:9999;

  mix-blend-mode:difference;

}

.cursor-ring{

  width:36px;
  height:36px;

  border:1px solid var(--accent);

  border-radius:50%;

  position:fixed;
  top:0;
  left:0;

  pointer-events:none;

  z-index:9998;

  mix-blend-mode:difference;

}

/* =========================================
   NAVBAR
========================================= */

.nav{

  position:fixed;

  top:20px;
  left:50%;

  transform:translateX(-50%);

  width:calc(100% - 60px);
  max-width:1400px;

  height:80px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 2rem;

  z-index:1000;

  border-radius:24px;

  border:1px solid rgba(255,255,255,.08);

  background:
  linear-gradient(
  135deg,
  rgba(255,255,255,.05),
  rgba(255,255,255,.015)
  );

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  overflow:hidden;

}

.nav::before{

  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
  90deg,
  transparent,
  rgba(255,30,30,.08),
  transparent
  );

  transform:translateX(-100%);

  animation:navGlow 7s linear infinite;

}

@keyframes navGlow{

  100%{
    transform:translateX(100%);
  }

}

.nav-blur{

  position:absolute;

  width:320px;
  height:320px;

  background:rgba(255,30,30,.12);

  filter:blur(100px);

  right:-120px;
  top:-160px;

}

.logo-wrap{

  display:flex;
  align-items:center;
  gap:14px;

  text-decoration:none;

  position:relative;
  z-index:2;

}

.logo-dot{

  width:12px;
  height:12px;

  border-radius:50%;

  background:var(--accent);

  box-shadow:
  0 0 20px rgba(255,30,30,.9),
  0 0 40px rgba(255,30,30,.5);

}

.logo-text{

  display:flex;
  flex-direction:column;

  line-height:1;

}

.logo-top{

  font-size:.6rem;
  letter-spacing:4px;

  color:#777;

  font-family:'Space Mono',monospace;

}

.logo-main{

  font-family:'Bebas Neue',sans-serif;

  font-size:2rem;
  letter-spacing:3px;

  color:#fff;

}

.nav-center{

  display:flex;
  align-items:center;
  gap:2.5rem;

  list-style:none;

  position:relative;
  z-index:2;

}

.nav-center a{

  position:relative;

  text-decoration:none;

  color:#aaa;

  font-size:.72rem;
  letter-spacing:3px;

  text-transform:uppercase;

  font-family:'Space Mono',monospace;

  transition:.4s;

}

.nav-center a::after{

  content:'';

  position:absolute;

  left:0;
  bottom:-8px;

  width:0%;
  height:1px;

  background:var(--accent);

  transition:.4s;

}

.nav-center a:hover{

  color:#fff;

}

.nav-center a:hover::after{

  width:100%;

}

.nav-right{

  display:flex;
  align-items:center;
  gap:1rem;

  position:relative;
  z-index:2;

}

.social-mini{

  width:40px;
  height:40px;

  border-radius:12px;

  border:1px solid rgba(255,255,255,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  color:#999;

  font-size:.7rem;
  letter-spacing:2px;

  transition:.3s;

}

.social-mini:hover{

  color:#fff;

  border-color:rgba(255,30,30,.5);

  background:rgba(255,30,30,.08);

}

.booking-btn{

  height:44px;

  padding:0 1.5rem;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:
  linear-gradient(
  135deg,
  #ff1e1e,
  #ff4d4d
  );

  color:#fff;

  text-decoration:none;

  font-size:.7rem;
  letter-spacing:3px;

  font-family:'Space Mono',monospace;

  box-shadow:
  0 10px 30px rgba(255,30,30,.25);

  transition:.4s;

}

.booking-btn:hover{

  transform:translateY(-2px);

  box-shadow:
  0 15px 40px rgba(255,30,30,.45);

}

/* =========================================
   HERO
========================================= */

.hero{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 8vw;

  position:relative;

}

.hero-content{

  max-width:700px;

  position:relative;
  z-index:2;

}

.hero-tag{

  display:inline-flex;
  align-items:center;
  gap:12px;

  margin-bottom:2rem;

  font-size:.75rem;
  letter-spacing:4px;

  text-transform:uppercase;

  color:#aaa;

  font-family:'Space Mono',monospace;

}

.hero-tag::before{

  content:'';

  width:50px;
  height:1px;

  background:var(--accent);

}

.hero h1{

  font-family:'Bebas Neue',sans-serif;

  font-size:clamp(6rem,14vw,12rem);

  line-height:.88;

  letter-spacing:3px;

}

.hero h1 span{

  color:var(--accent);

  text-shadow:
  0 0 30px rgba(255,30,30,.5);

}

.hero-sub{

  margin-top:1.5rem;

  font-size:1rem;

  letter-spacing:5px;

  text-transform:uppercase;

  color:var(--muted);

}

.hero-btns{

  display:flex;
  gap:1rem;

  margin-top:3rem;

  flex-wrap:wrap;

}

.btn-main{

  height:58px;

  padding:0 2rem;

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  background:
  linear-gradient(
  135deg,
  #ff1e1e,
  #ff5a5a
  );

  color:#fff;

  font-family:'Space Mono',monospace;

  letter-spacing:3px;

  text-transform:uppercase;

  font-size:.75rem;

  transition:.4s;

}

.btn-main:hover{

  transform:translateY(-4px);

  box-shadow:
  0 15px 40px rgba(255,30,30,.4);

}

.btn-outline{

  height:58px;

  padding:0 2rem;

  border-radius:16px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-decoration:none;

  border:1px solid rgba(255,255,255,.1);

  color:#fff;

  font-family:'Space Mono',monospace;

  letter-spacing:3px;

  text-transform:uppercase;

  font-size:.75rem;

  transition:.4s;

}

.btn-outline:hover{

  border-color:rgba(255,30,30,.5);

  background:rgba(255,30,30,.08);

}

/* =========================================
   VINYL VISUAL
========================================= */

.hero-visual{

  position:relative;

  width:500px;
  height:500px;

  display:flex;
  align-items:center;
  justify-content:center;

}

.vinyl-glow{

  position:absolute;

  width:100%;
  height:100%;

  border-radius:50%;

  background:rgba(255,30,30,.18);

  filter:blur(80px);

}

.vinyl{

  width:100%;
  height:100%;

  border-radius:50%;

  position:relative;

  animation:spin 10s linear infinite;

  background:
  radial-gradient(circle at center,
  #181818 0%,
  #0c0c0c 30%,
  #1f1f1f 31%,
  #080808 45%,
  #1f1f1f 47%,
  #090909 65%,
  #222 67%,
  #000 100%);

  border:2px solid rgba(255,255,255,.08);

  box-shadow:
  0 0 100px rgba(255,30,30,.2);

}

.vinyl::before{

  content:'';

  position:absolute;

  inset:38%;

  border-radius:50%;

  background:
  radial-gradient(circle,
  #ff1e1e 0%,
  #ff5959 40%,
  #ffffff 100%);

}

.vinyl::after{

  content:'';

  position:absolute;

  inset:47%;

  border-radius:50%;

  background:#000;

}

@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* =========================================
   WAVEFORM
========================================= */

.waveform{

  position:absolute;

  bottom:90px;
  left:8vw;

  display:flex;
  align-items:flex-end;

  gap:4px;

  height:70px;

}

.bar{

  width:4px;

  background:var(--accent);

  border-radius:20px;

  animation:wave 1s ease-in-out infinite;

}

.bar:nth-child(2n){

  background:#fff;

}

@keyframes wave{

  0%,100%{
    height:10px;
    opacity:.4;
  }

  50%{
    height:60px;
    opacity:1;
  }

}

/* =========================================
   MOBILE
========================================= */

@media(max-width:1100px){

  .hero{

    flex-direction:column;
    justify-content:center;

    gap:4rem;

    text-align:center;

    padding:10rem 2rem 6rem;

  }

  .hero-tag{

    justify-content:center;

  }

  .waveform{

    left:50%;
    transform:translateX(-50%);

  }

  .hero-visual{

    width:320px;
    height:320px;

  }

}

@media(max-width:900px){

  .nav{

    width:calc(100% - 20px);

    top:10px;

    padding:0 1rem;

    height:72px;

  }

  .nav-center{

    display:none;

  }

  .social-mini{

    display:none;

  }

  .logo-main{

    font-size:1.5rem;

  }

  .hero h1{

    font-size:5rem;

  }

  .hero-sub{

    font-size:.8rem;

    line-height:1.7;

  }

  .hero-btns{

    justify-content:center;

  }

}

</style>

</head>

<body>

<!-- CURSOR -->

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- NAV -->

<nav class="nav">

<div class="nav-blur"></div>

<a href="#" class="logo-wrap">

<div class="logo-dot"></div>

<div class="logo-text">

<span class="logo-top">
DJ
</span>

<span class="logo-main">
CARLOS JEREZ
</span>

</div>

</a>

<ul class="nav-center">

<li>
<a href="#">Inicio</a>
</li>

<li>
<a href="#">Mixes</a>
</li>

<li>
<a href="#">Eventos</a>
</li>

<li>
<a href="#">Galería</a>
</li>

</ul>

<div class="nav-right">

<a href="https://www.instagram.com/djcarlosjerezrd"
target="_blank"
class="social-mini">
IG
</a>

<a href="https://soundcloud.com/djcarlosjerez"
target="_blank"
class="social-mini">
SC
</a>

<a href="#"
class="booking-btn">
BOOKING
</a>

</div>

</nav>

<!-- HERO -->

<section class="hero">

<div class="hero-content">

<p class="hero-tag">
Santiago · República Dominicana
</p>

<h1>

DJ<br>

<span>CARLOS</span><br>

JEREZ

</h1>

<p class="hero-sub">
TECH HOUSE · AFRO HOUSE · DEEP HOUSE · MELODIC TECHNO
</p>

<div class="hero-btns">

<a href="https://www.youtube.com/watch?v=Zs6tZXE9GkY"
target="_blank"
class="btn-main">

▶ WATCH MIX

</a>

<a href="https://soundcloud.com/djcarlosjerez"
target="_blank"
class="btn-outline">

SOUNDCLOUD →

</a>

</div>

</div>

<div class="hero-visual">

<div class="vinyl-glow"></div>

<div class="vinyl"></div>

</div>

<div class="waveform" id="waveform"></div>

</section>

<script>

/* =========================================
   CURSOR
========================================= */

const cursor =
document.getElementById('cursor');

const ring =
document.getElementById('cursorRing');

let mx = 0;
let my = 0;

let rx = 0;
let ry = 0;

document.addEventListener('mousemove', e => {

mx = e.clientX;
my = e.clientY;

cursor.style.transform =
`translate(${mx - 6}px, ${my - 6}px)`;

});

function animateRing(){

rx += (mx - rx) * 0.12;
ry += (my - ry) * 0.12;

ring.style.transform =
`translate(${rx - 18}px, ${ry - 18}px)`;

requestAnimationFrame(animateRing);

}

animateRing();

/* =========================================
   WAVEFORM
========================================= */

const wf =
document.getElementById('waveform');

for(let i = 0; i < 40; i++){

const bar =
document.createElement('div');

bar.className = 'bar';

bar.style.height =
(10 + Math.random() * 55) + 'px';

bar.style.animationDelay =
(Math.random() * 1) + 's';

wf.appendChild(bar);

}

</script>

</body>
</html>
